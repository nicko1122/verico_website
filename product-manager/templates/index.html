<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="font-sans bg-slate-100">
    <div class="max-w-5xl mx-auto p-6">
      <h1 class="text-2xl font-bold mb-4">Product Manager</h1>

      <form id="uploadForm" class="mb-6 bg-white p-4 rounded-xl border">
        <label class="block text-sm mb-2 font-medium">Upload Product ZIP</label>
        <input type="file" id="file" name="file" accept=".zip" class="block mb-3" />
        <button class="px-4 py-2 bg-black text-white rounded-lg" type="submit">Upload & Generate</button>
        <span id="uploadMsg" class="ml-3 text-sm"></span>
      </form>

      <div class="bg-white p-4 rounded-xl border mb-4 flex items-center justify-between">
        <div>
          <h2 class="text-lg font-semibold">Products</h2>
          <p class="text-sm text-gray-500">List by category. Select to delete.</p>
        </div>
        <button id="deleteBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg disabled:opacity-50" disabled>Delete Selected</button>
      </div>

      <div id="list" class="space-y-6"></div>
    </div>

    <script>
      async function fetchList(){
        const r = await fetch('/api/list');
        const j = await r.json();
        const root = document.getElementById('list');
        root.innerHTML = '';
        if(!j.ok){ root.textContent = 'Error: ' + j.error; return; }

        const groups = j.groups || {};
        const catOrder = ['powerbank','loopenergy','gan_charger','flash_disk'];
        const rounded = {'powerbank':'rose','loopenergy':'emerald','gan_charger':'sky','flash_disk':'amber'};
        const keys = Object.keys(groups).sort((a,b)=>catOrder.indexOf(a)-catOrder.indexOf(b));
        keys.forEach(cat=>{
          const items = groups[cat] || [];
          const sec = document.createElement('section');
          sec.className = 'bg-white border rounded-xl';
          sec.innerHTML = `
            <div class="px-4 py-3 border-b flex items-center justify-between">
              <h3 class="font-semibold capitalize">${cat.replace('_','-')}</h3>
              <span class="text-sm text-gray-500">${items.length} items</span>
            </div>
            <div class="divide-y" id="tbl-${cat}"></div>
          `;
          root.appendChild(sec);
          const tbl = sec.querySelector('#tbl-'+cat);
          items.forEach(it=>{
            const row = document.createElement('div');
            row.className = 'px-4 py-3 flex items-center gap-3';
            row.innerHTML = `
              <input type="checkbox" class="chk" data-file="${it.yaml_file}">
              <div class="flex-1">
                <div class="font-medium">${it.en_name}</div>
                <div class="text-xs text-gray-500">${it.yaml_file} · ${it.url_en}</div>
              </div>
              <div class="text-xs text-gray-500">images: ${it.images_count}</div>
            `;
            tbl.appendChild(row);
          });
        });

        bindChecks();
      }

      function bindChecks(){
        const chks = Array.from(document.querySelectorAll('.chk'));
        const btn = document.getElementById('deleteBtn');
        function refresh(){
          btn.disabled = chks.every(c=>!c.checked);
        }
        chks.forEach(c=>c.addEventListener('change', refresh));
        refresh();
        btn.onclick = async ()=>{
          const files = chks.filter(c=>c.checked).map(c=>c.dataset.file);
          btn.disabled = true; btn.textContent = 'Deleting...';
          try{
            const r = await fetch('/api/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ yaml_files: files })});
            const j = await r.json();
            if(!j.ok){ alert('Delete error: '+j.error); }
            await fetchList();
          }finally{
            btn.textContent = 'Delete Selected';
          }
        };
      }

      document.getElementById('uploadForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const el = document.getElementById('file');
        const msg = document.getElementById('uploadMsg');
        if(!el.files || !el.files[0]){ msg.textContent = 'Choose a zip file'; return; }
        const fd = new FormData(); fd.append('file', el.files[0]);
        msg.textContent = 'Uploading...';
        const r = await fetch('/upload', { method:'POST', body: fd });
        const j = await r.json();
        if(j.ok){ msg.textContent = 'Done: ' + j.product_url; await fetchList(); }
        else { msg.textContent = 'Error: ' + j.error; }
      });

      fetchList();
    </script>
  </body>
  </html>
