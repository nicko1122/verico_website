<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verico Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="font-sans bg-slate-100 min-h-screen">
    <nav class="bg-black text-white">
      <div class="max-w-5xl mx-auto px-6 py-3 flex items-center gap-6">
        <span class="font-bold">Verico Admin</span>
        <a href="/" class="text-sm {{ 'text-white font-semibold' if active=='dashboard' else 'text-gray-400 hover:text-white' }}">Dashboard</a>
        <a href="/setup" class="text-sm {{ 'text-white font-semibold' if active=='setup' else 'text-gray-400 hover:text-white' }}">Setup</a>
        <a href="/compose" class="text-sm {{ 'text-white font-semibold' if active=='compose' else 'text-gray-400 hover:text-white' }}">Compose</a>
        <a href="/products" class="text-sm {{ 'text-white font-semibold' if active=='products' else 'text-gray-400 hover:text-white' }}">Products</a>
        <a href="/ops" class="text-sm {{ 'text-white font-semibold' if active=='ops' else 'text-gray-400 hover:text-white' }}">Build &amp; Deploy</a>
      </div>
    </nav>
    <div class="max-w-5xl mx-auto p-6">
      {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
