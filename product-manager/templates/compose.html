{% extends 'base.html' %}
{% block content %}
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-bold">Compose(產品撰寫)</h1>
    <span id="saveState" class="text-xs text-gray-400"></span>
  </div>

  <!-- 草稿 / 樣板列 -->
  <div class="bg-white p-3 rounded-xl border mb-4 flex flex-wrap items-center gap-2 text-sm">
    <label class="text-gray-500">草稿</label>
    <select id="draftSel" class="border rounded-lg px-2 py-1.5"></select>
    <button id="newDraftBtn" class="px-3 py-1.5 bg-black text-white rounded-lg">新草稿</button>
    <button id="delDraftBtn" class="px-3 py-1.5 border border-red-300 text-red-700 rounded-lg">刪除草稿</button>
    <span class="mx-2 text-gray-300">|</span>
    <label class="text-gray-500">樣板</label>
    <select id="tplSel" class="border rounded-lg px-2 py-1.5"></select>
    <button id="loadTplBtn" class="px-3 py-1.5 bg-slate-700 text-white rounded-lg">載入樣板(覆蓋內容)</button>
  </div>

  <div class="grid lg:grid-cols-3 gap-4">
    <!-- 編輯器 -->
    <div class="lg:col-span-2">
      <textarea id="editor" spellcheck="false" placeholder="先建立/選擇草稿,或載入樣板開始撰寫…"
        class="w-full h-[34rem] border rounded-xl p-4 font-mono text-sm bg-white leading-relaxed"></textarea>
      <div class="mt-3 flex flex-wrap items-center gap-2">
        <a id="zipBtn" href="#" class="px-4 py-2 bg-black text-white rounded-lg text-sm">下載 ZIP</a>
        <button id="submitBtn" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm">送處理(產生產品頁)</button>
        <span id="submitMsg" class="text-sm"></span>
      </div>
    </div>

    <!-- 右側輔助面板 -->
    <div class="space-y-4">
      <section class="bg-white p-4 rounded-xl border">
        <h2 class="font-semibold mb-2 text-sm">圖片(images/)</h2>
        <input type="file" id="imgInput" multiple accept=".png,.jpg,.jpeg,.svg,.webp,.gif" class="block text-xs mb-2" />
        <div id="imgList" class="space-y-1 max-h-56 overflow-y-auto text-xs text-gray-600"></div>
      </section>

      <section class="bg-white p-4 rounded-xl border">
        <h2 class="font-semibold mb-2 text-sm">快捷插入</h2>
        <div class="flex flex-wrap gap-1.5 text-xs">
          <button class="snip px-2 py-1 border rounded-lg" data-snip="spec">規格行</button>
          <button class="snip px-2 py-1 border rounded-lg" data-snip="feature">Detailed Feature</button>
          <button class="snip px-2 py-1 border rounded-lg" data-snip="compat">Compatibility 項</button>
          <button class="snip px-2 py-1 border rounded-lg" data-snip="package">Package 項</button>
          <button class="snip px-2 py-1 border rounded-lg" data-snip="variant">Variant(Also Available)</button>
        </div>
        <div class="mt-3 flex items-center gap-1.5 text-xs">
          <select id="iconSel" class="border rounded-lg px-2 py-1 flex-1 min-w-0"></select>
          <button id="iconBtn" class="px-2 py-1 border rounded-lg whitespace-nowrap">插入 Icon</button>
        </div>
        <div class="mt-2 flex items-center gap-1.5 text-xs">
          <select id="catSel" class="border rounded-lg px-2 py-1 flex-1">
            <option value="powerbank">powerbank</option>
            <option value="loopenergy">loopenergy</option>
            <option value="gan_charger">gan_charger</option>
            <option value="flash_disk">flash_disk</option>
          </select>
          <button id="catBtn" class="px-2 py-1 border rounded-lg whitespace-nowrap">設定 Category</button>
        </div>
      </section>

      <section class="bg-white p-4 rounded-xl border">
        <h2 class="font-semibold mb-2 text-sm">格式檢查</h2>
        <div id="lint" class="text-xs space-y-1 text-gray-500">(尚無內容)</div>
      </section>
    </div>
  </div>
{% endblock %}
{% block scripts %}
<script>
const editor = document.getElementById('editor');
const draftSel = document.getElementById('draftSel');
const tplSel = document.getElementById('tplSel');
const iconSel = document.getElementById('iconSel');
const saveState = document.getElementById('saveState');
let current = null;        // 目前草稿名
let images = [];           // 已上傳圖片
let saveTimer = null;

const SNIPPETS = {
  spec: '- 規格名稱: 值\n',
  feature: '### 特色標題\nImage: images/請替換.jpg\n一句話描述這個特色。\nBenefits:\n- 好處一\n- 好處二\n- 好處三\n\n',
  compat: '- 裝置名稱\n  Icon: icons/icon-laptop.svg\n',
  package: '- 1 × 內容物名稱\n  Icon: icons/icon-cable.svg\n',
  variant: '### 版本名稱\nPackage Image: images/請替換.jpg\nModel Name: 型號名稱\nSKU: SKU-001\nEAN: 4710000000000\n\n',
};

function insertAtCursor(text){
  if(!current){ alert('請先建立或選擇草稿'); return; }
  const s = editor.selectionStart, e = editor.selectionEnd;
  editor.value = editor.value.slice(0, s) + text + editor.value.slice(e);
  editor.selectionStart = editor.selectionEnd = s + text.length;
  editor.focus();
  scheduleSave();
}

// ---------- 載入 meta ----------
async function loadMeta(keepDraft){
  const j = await (await fetch('/api/compose/meta')).json();
  tplSel.innerHTML = j.templates.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
  iconSel.innerHTML = j.icons.map(i=>`<option value="${i}">${i}</option>`).join('');
  const prev = keepDraft ? current : null;
  draftSel.innerHTML = '<option value="">(選擇草稿)</option>' +
    j.drafts.map(d=>`<option value="${d.name}">${d.name}</option>`).join('');
  if(prev) draftSel.value = prev;
}

// ---------- 草稿 ----------
async function openDraft(name){
  const j = await (await fetch('/api/compose/draft/'+encodeURIComponent(name))).json();
  if(!j.ok){ alert(j.error); return; }
  current = j.name;
  editor.value = j.md;
  images = j.images;
  renderImages(); lint();
  document.getElementById('zipBtn').href = '/api/compose/draft/'+encodeURIComponent(current)+'/zip';
  saveState.textContent = '已載入';
}
draftSel.addEventListener('change', ()=>{ if(draftSel.value) openDraft(draftSel.value); });

document.getElementById('newDraftBtn').addEventListener('click', async ()=>{
  const name = prompt('草稿名稱(建議用產品英文名,將成為 ZIP 檔名):');
  if(!name) return;
  const r = await fetch('/api/compose/draft/'+encodeURIComponent(name), {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({md: ''})});
  const j = await r.json();
  if(!j.ok){ alert(j.error); return; }
  await loadMeta();
  draftSel.value = j.name;
  await openDraft(j.name);
});

document.getElementById('delDraftBtn').addEventListener('click', async ()=>{
  if(!current) return;
  if(!confirm('刪除草稿「'+current+'」?(含已上傳圖片,不可復原)')) return;
  await fetch('/api/compose/draft/'+encodeURIComponent(current), {method:'DELETE'});
  current = null; editor.value = ''; images = []; renderImages(); lint();
  await loadMeta();
});

// ---------- 樣板 ----------
document.getElementById('loadTplBtn').addEventListener('click', async ()=>{
  if(!current){ alert('請先建立或選擇草稿'); return; }
  if(editor.value.trim() && !confirm('會覆蓋目前編輯內容,確定?')) return;
  const j = await (await fetch('/api/compose/template/'+encodeURIComponent(tplSel.value))).json();
  if(!j.ok){ alert(j.error); return; }
  editor.value = j.content;
  scheduleSave(); lint();
});

// ---------- 自動存檔 ----------
function scheduleSave(){
  if(!current) return;
  saveState.textContent = '編輯中…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const r = await fetch('/api/compose/draft/'+encodeURIComponent(current), {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({md: editor.value})});
    const j = await r.json();
    saveState.textContent = j.ok ? '已自動儲存 '+new Date().toLocaleTimeString() : '儲存失敗!';
  }, 1200);
}
editor.addEventListener('input', ()=>{ scheduleSave(); lint(); });

// ---------- 圖片 ----------
function renderImages(){
  const root = document.getElementById('imgList');
  if(!images.length){ root.innerHTML = '<div class="text-gray-400">(尚未上傳)</div>'; return; }
  root.innerHTML = images.map(f=>`
    <div class="flex items-center gap-1.5 py-0.5">
      <img src="/api/compose/draft/${encodeURIComponent(current)}/images/${encodeURIComponent(f)}" class="w-8 h-8 object-contain bg-slate-50 border rounded" />
      <span class="flex-1 truncate" title="${f}">${f}</span>
      <button class="ins px-1.5 py-0.5 border rounded" data-t="- images/${f}\n" title="插入 Images 清單項">清單</button>
      <button class="ins px-1.5 py-0.5 border rounded" data-t="Image: images/${f}\n" title="插入 Image: 欄位">Image:</button>
      <button class="del px-1.5 py-0.5 border border-red-200 text-red-600 rounded" data-f="${f}">✕</button>
    </div>`).join('');
  root.querySelectorAll('.ins').forEach(b=>b.addEventListener('click', ()=>insertAtCursor(b.dataset.t)));
  root.querySelectorAll('.del').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('刪除圖片 '+b.dataset.f+'?')) return;
    const j = await (await fetch('/api/compose/draft/'+encodeURIComponent(current)+'/images/'+encodeURIComponent(b.dataset.f), {method:'DELETE'})).json();
    images = j.images || []; renderImages(); lint();
  }));
}
document.getElementById('imgInput').addEventListener('change', async (e)=>{
  if(!current){ alert('請先建立或選擇草稿'); e.target.value=''; return; }
  const fd = new FormData();
  for(const f of e.target.files) fd.append('files', f);
  const j = await (await fetch('/api/compose/draft/'+encodeURIComponent(current)+'/images', {method:'POST', body: fd})).json();
  if(j.skipped && j.skipped.length) alert('略過非圖片檔:'+j.skipped.join(', '));
  images = j.images || []; renderImages(); lint();
  e.target.value = '';
});

// ---------- 快捷插入 ----------
document.querySelectorAll('.snip').forEach(b=>b.addEventListener('click', ()=>insertAtCursor(SNIPPETS[b.dataset.snip])));
document.getElementById('iconBtn').addEventListener('click', ()=>insertAtCursor('  Icon: icons/'+iconSel.value+'\n'));
document.getElementById('catBtn').addEventListener('click', ()=>{
  if(!current){ alert('請先建立或選擇草稿'); return; }
  const cat = document.getElementById('catSel').value;
  if(/^Category:.*$/m.test(editor.value)){
    editor.value = editor.value.replace(/^Category:.*$/m, 'Category: '+cat);
  } else {
    insertAtCursor('Category: '+cat+'\n'); return;
  }
  scheduleSave(); lint();
});

// ---------- 格式檢查(client-side)----------
function lint(){
  const root = document.getElementById('lint');
  const md = editor.value;
  if(!md.trim()){ root.innerHTML = '<div class="text-gray-400">(尚無內容)</div>'; return; }
  const errs = [], warns = [];
  const CATS = ['powerbank','loopenergy','gan_charger','flash_disk'];
  const catM = md.match(/^Category:\s*(\S+)/m);
  if(!catM) errs.push('缺 Category:');
  else if(!CATS.includes(catM[1])) warns.push('Category「'+catM[1]+'」不在已知分類:'+CATS.join('/'));
  if(!/^Short Description:/m.test(md)) errs.push('缺 Short Description:');
  if(!/^## Images/m.test(md)) errs.push('缺 ## Images 區塊');
  if(!/^## Features/m.test(md)) errs.push('缺 ## Features 區塊');
  if(!/^## Technical Specifications/m.test(md)) errs.push('缺 ## Technical Specifications 區塊');
  // 引用的圖 vs 已上傳
  const refs = new Set([...md.matchAll(/images\/([A-Za-z0-9._ -]+\.(?:png|jpe?g|svg|webp|gif))/gi)].map(m=>m[1]));
  for(const r of refs) if(!images.includes(r)) warns.push('引用了未上傳的圖:images/'+r+'(或為「請替換」佔位)');
  for(const i of images) if(!refs.has(i)) warns.push('已上傳但未引用:'+i);
  const rows = [];
  errs.forEach(e=>rows.push('<div class="text-red-600">✘ '+e+'</div>'));
  warns.forEach(w=>rows.push('<div class="text-amber-600">⚠ '+w+'</div>'));
  if(!rows.length) rows.push('<div class="text-green-600">✔ 通過(必填齊全,圖片引用一致)</div>');
  root.innerHTML = rows.join('');
  return errs.length === 0;
}

// ---------- 下載 / 送處理 ----------
document.getElementById('zipBtn').addEventListener('click', (e)=>{
  if(!current){ e.preventDefault(); alert('請先建立或選擇草稿'); }
});
document.getElementById('submitBtn').addEventListener('click', async ()=>{
  if(!current){ alert('請先建立或選擇草稿'); return; }
  const ok = lint();
  if(!ok && !confirm('格式檢查未通過,仍要送處理?')) return;
  if(!confirm('送出後會呼叫 LLM 解析/翻譯並直接寫入網站資料(src/),確定?')) return;
  const msg = document.getElementById('submitMsg');
  msg.textContent = '處理中(LLM 解析+翻譯,約 1-2 分鐘)…';
  try{
    const j = await (await fetch('/api/compose/draft/'+encodeURIComponent(current)+'/submit', {method:'POST'})).json();
    msg.innerHTML = j.ok
      ? '<span class="text-green-600">完成:'+j.product_url+'(到 Build & Deploy 頁 Preview 確認)</span>'
      : '<span class="text-red-600">失敗:'+j.error+'</span>';
  }catch(err){
    msg.innerHTML = '<span class="text-red-600">失敗:'+err+'</span>';
  }
});

loadMeta();
</script>
{% endblock %}
