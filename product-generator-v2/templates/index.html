<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Uploader (V2)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-lg">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-700">Upload Product Package (V2)</h1>
    <form id="upload-form" action="/upload" method="post" enctype="multipart/form-data">
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Product Zip (.zip)</label>
        <input type="file" name="file" id="file-input" accept=".zip" class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none">
      </div>
      <div class="text-center">
        <button type="submit" id="submit-button" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg disabled:opacity-50" disabled>
          Upload and Process
        </button>
      </div>
    </form>
    <div id="result" class="mt-6 text-center hidden">
      <div id="spinner" class="mx-auto hidden border-4 border-gray-200 border-t-blue-500 rounded-full w-8 h-8 animate-spin"></div>
      <p id="status" class="text-sm mt-3"></p>
      <a id="url" href="#" target="_blank" class="text-blue-600 hover:underline text-sm hidden"></a>
    </div>
  </div>

  <script>
    const form = document.getElementById('upload-form');
    const fileInput = document.getElementById('file-input');
    const submitButton = document.getElementById('submit-button');
    const result = document.getElementById('result');
    const spinner = document.getElementById('spinner');
    const status = document.getElementById('status');
    const url = document.getElementById('url');

    fileInput.addEventListener('change', () => {
      submitButton.disabled = fileInput.files.length === 0;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!fileInput.files.length) return;

      submitButton.disabled = true;
      result.classList.remove('hidden');
      spinner.classList.remove('hidden');
      status.textContent = 'Uploading and processing...';
      status.className = 'text-sm text-gray-600 mt-3';
      url.classList.add('hidden');

      const formData = new FormData(form);
      try {
        const resp = await fetch('/upload', { method: 'POST', body: formData });
        const data = await resp.json();
        spinner.classList.add('hidden');
        status.textContent = data.message || (resp.ok ? 'Done.' : 'Failed.');
        status.className = 'text-sm ' + (resp.ok ? 'text-green-600' : 'text-red-600');
        if (resp.ok && data.product_url) {
          url.href = data.product_url; url.textContent = data.product_url; url.classList.remove('hidden');
        }
      } catch (err) {
        spinner.classList.add('hidden');
        status.textContent = 'Unexpected error.';
        status.className = 'text-sm text-red-600';
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
