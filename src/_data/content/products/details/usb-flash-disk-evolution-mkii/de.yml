features:
  section_title: Erweiterte Funktionen
  section_intro: VERICO Evolution MKII ist Ihre erste Wahl für Lethalität mit seinem schnellen USB 3.0 und militärischem Waffen-Look.
  items:
    - title: Tödliche Geschwindigkeit & Robust
      icon: speed.svg
      description: Schneller USB 3.0 mit robustem Design
      bullets:
        - USB 3.0/2.0 Schnittstelle
        - Rückwärtskompatibel mit USB 1.1
        - Robust aussehend mit gebürsteter Metalloberfläche
        - Militärischer Waffen-Ästhetik
      image: assets/images/product/features/lethal-speed.jpg
    - title: Verlieren Sie nie Ihren Mündungsschutz
      icon: design.svg
      description: Intelligentes Design verhindert Verlust
      bullets:
        - USB-Deckel klammert sich an den Rücken
        - Verlieren Sie nie den Deckel
        - Intelligentes Design-Feature
        - Praktische Aufbewahrung
      image: assets/images/product/features/muzzle-cover.jpg
    - title: Breite Palette an Arsenal-Kraft
      icon: capacity.svg
      description: Verschiedene Farben und Kapazitäten
      bullets:
        - Verfügbar von 8GB bis 128GB
        - Mehrere Farboptionen
        - Olivgrün, Marineblau, Kardinalrot, Metallgrau
        - Flexible Speicherlösungen
      image: assets/images/product/features/arsenal-power.jpg
    - title: Universelle Kompatibilität
      icon: compatibility.svg
      description: Funktioniert mit allen wichtigen Betriebssystemen
      bullets:
        - Windows XP/Vista/7/8/10
        - Mac OS X 10.5, 10.6 empfohlen
        - USB 2.0 Anschluss kompatibel
        - Plug and Play Funktionalität
      image: assets/images/product/features/universal-compatibility.jpg

