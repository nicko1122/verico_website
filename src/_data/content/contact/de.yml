  phone:
    title: "Telefon"
    description: "Sprechen Sie direkt mit unserem Verkaufsteam"
    number: "+886 2 2345 6789"
    hours: "Mo-Fr: 9:00 - 18:00 Uhr"
    icon: "phone"
    color: "blue"
  email:
    title: "E-Mail"
    description: "Senden Sie uns jederzeit eine Nachricht"
    address: "info@verico.com"
    response: "Wir antworten innerhalb von 24 Stunden"
    icon: "email"
    color: "green"
  office:
    title: "Büro"
    description: "Besuchen Sie unseren Hauptsitz"
    location: "Taipei, Taiwan"
    address: "Nr. 123, Tech Street"
    icon: "location"
