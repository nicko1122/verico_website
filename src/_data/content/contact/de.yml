contact_form:
  title: "Senden Sie uns eine Nachricht"
  fields:
    name:
      label: "Vollständiger Name *"
      type: "text"
      required: true
    email:
      label: "E-Mail-Adresse *"
      type: "email"
      required: true
    company:
      label: "Unternehmen"
      type: "text"
      required: false
    subject:
      label: "Betreff *"
      type: "select"
      required: true
      options:
        - value: ""
          text: "Wählen Sie ein Thema"
        - value: "sales"
          text: "Verkaufsanfrage"
        - value: "support"
          text: "Technischer Support"
        - value: "partnership"
          text: "Partnerschaft"
        - value: "general"
          text: "Allgemeine Anfrage"
    message:
      label: "Nachricht *"
      type: "textarea"
      required: true
      rows: 6
  submit_button: "Nachricht senden"

company_info:
  title: "Unternehmensinformationen"
  items:
    - title: "Geschäftszeiten"
      description: "Montag - Freitag: 9:00 - 18:00 Uhr<br>Samstag: 10:00 - 16:00 Uhr"
      icon: "building"
    - title: "Antwortzeit"
      description: "E-Mail: Innerhalb von 24 Stunden<br>Telefon: Sofort während der Geschäftszeiten"
      icon: "clock"
    - title: "Zertifizierungen"
      description: "ISO 9001, CE, FCC, RoHS<br>UL gelistete Produkte"
      icon: "check"

office_map:
  title: "Verico Hauptsitz"
  address: "Nr. 123, Tech Street<br>Taipei, Taiwan 100"
  image: "assets/images/contact/office-map.jpg"
  alt: "Bürostandort Karte"

faq:
  title: "Häufig gestellte Fragen"
  subtitle: "Finden Sie Antworten auf häufige Fragen zu unseren Produkten und Dienstleistungen"
  questions:
    - question: "Welche Zahlungsmethoden akzeptieren Sie?"
      answer: "Wir akzeptieren alle gängigen Kreditkarten, Banküberweisungen und PayPal. Für Großbestellungen bieten wir auch Netto-30-Zahlungsbedingungen für qualifizierte Unternehmen."
    - question: "Bieten Sie internationalen Versand an?"
      answer: "Ja, wir versenden weltweit. Versandzeiten und -kosten variieren je nach Standort. Kontaktieren Sie uns für spezifische Versandangebote für Ihre Region."
    - question: "Wie ist Ihre Garantierichtlinie?"
      answer: "Alle unsere Produkte kommen mit einer mindestens 1-jährigen Garantie. Premium-Produkte umfassen erweiterte Garantieoptionen. Kontaktieren Sie uns für Garantiedetails."
    - question: "Können Sie maßgeschneiderte Lösungen anbieten?"
      answer: "Ja, wir bieten maßgeschneiderte Batterie- und Speicherlösungen für OEM-Kunden. Unser Ingenieurteam kann mit Ihnen zusammenarbeiten, um maßgeschneiderte Lösungen zu entwickeln." 