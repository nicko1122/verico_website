  - assets/images/product/verico-phantom-3d-nand-ssd/Product-2.png
  features:
  - 'Ultra-fast performance: up to 550MB/s read, 500MB/s write speeds'
  - Turbo-Boost SLC Cache technology for consistent high speeds
  - '100% solid-state design: shock- and vibration-proof'
  - Advanced data protection with TRIM, ECC, RAID capability, and S.M.A.R.T. monitoring
  - Premium 3D NAND Flash with high-quality controller
  - Slim 7mm ultra-thin form factor for broad compatibility
  - 3-year warranty with rigorous quality testing
  specs:
  - name: Interface
    value: SATA3 6Gb/s (backward compatible with SATA II)
  - name: Form Factor
    value: 2.5", 7mm ultra-thin
  - name: Dimensions
    value: 69 x 100.2 x 7 mm
  - name: Weight
    value: 77g
  - name: Capacities
    value: 120GB, 240GB, 480GB, 960GB, 2TB
  - name: Read Speed
    value: Up to 550MB/s (all capacities)
  - name: Write Speed
    value: Up to 500MB/s (240GB/480GB/960GB/2TB), 430MB/s (120GB)
  badge: premium
  featured_rank: 1
  detailed_features:
