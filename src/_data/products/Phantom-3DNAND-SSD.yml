    items:
    - title: Ultra-Fast Performance
      description: Delivers exceptional read and write speeds for rapid data access
        and transfer.
      benefits:
      - Up to 550MB/s read speed (all capacities)
      - Up to 500MB/s write speed (240GB/480GB/960GB/2TB), 430MB/s (120GB)
      - High-speed SATA3 6Gb/s interface
      image: assets/images/product/verico-phantom-3d-nand-ssd/feature-1.png
      image_alt: Ultra-Fast Performance
    - title: Advanced Data Protection
      description: Advanced protection features ensure data integrity and device safety.
      benefits:
      - '100% solid-state design: shock- and vibration-proof, no moving parts'
      - 'Advanced data protection: TRIM command, ECC, RAID capability, and S.M.A.R.T.
        monitoring'
      image: assets/images/product/verico-phantom-3d-nand-ssd/feature-2.png
      image_alt: Advanced Data Protection
    - title: Broad Compatibility
      description: Slim design fits most devices for easy installation and instant
        performance boost.
      benefits:
      - Slim 7mm ultra-thin form factor
      - Compatible with most desktops, laptops (including Ultrabooks)
      - PlayStation 4/4 Pro compatible (240GB and above)
      - Simple installation process
      image: assets/images/product/verico-phantom-3d-nand-ssd/feature-3.png
      image_alt: Broad Compatibility
