  description: Die VERICO Phantom 3D NAND SSD bietet ultraschnelle Leistung mit bis
    zu 550MB/s Lesegeschwindigkeit und 500MB/s Schreibgeschwindigkeit. Ausgestattet
    mit SLC-Cache-Technologie, fortschrittlichem Datenschutz und einem schlanken 7mm
    Formfaktor für nahtlose Upgrades bei Desktops, Laptops und Spielkonsolen.
  catalog_image: assets/images/product/verico-phantom-3d-nand-ssd/Phantom-main.png
  hero_background: assets/images/global/ssd-hero.jpg
