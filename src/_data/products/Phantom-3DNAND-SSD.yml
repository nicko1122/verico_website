en:
  name: VERICO Phantom 3D NAND SSD
  category: flash_disk
  description: The VERICO Phantom 3D NAND SSD delivers ultra-fast performance with
    up to 550MB/s read speeds and 500MB/s write speeds. Featuring SLC Cache technology,
    advanced data protection, and a slim 7mm form factor for seamless upgrades across
    desktops, laptops, and gaming consoles.
  catalog_image: assets/images/product/verico-phantom-3d-nand-ssd/Phantom-main.png
  hero_background: assets/images/global/ssd-hero.jpg
  images:
