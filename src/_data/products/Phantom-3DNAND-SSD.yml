  - name: Abmessungen
    value: 69 x 100,2 x 7 mm
  - name: Gewicht
    value: 77g
  - name: Kapazitäten
    value: 120GB, 240GB, 480GB, 960GB, 2TB
  - name: Lesegeschwindigkeit
    value: Bis zu 550MB/s (alle Kapazitäten)
  - name: Schreibgeschwindigkeit
    value: Bis zu 500MB/s (240GB/480GB/960GB/2TB), 430MB/s (120GB)
  badge: premium
