  detailed_features:
    title: Detaillierte Funktionen
    subtitle: ''
    items:
    - title: Ultraschnelle Leistung
      description: Bietet außergewöhnliche Lese- und Schreibgeschwindigkeiten für
        schnellen Datenzugriff und -transfer.
      benefits:
      - Bis zu 550MB/s Lesegeschwindigkeit (alle Kapazitäten)
      - Bis zu 500MB/s Schreibgeschwindigkeit (240GB/480GB/960GB/2TB), 430MB/s (120GB)
      - Hochgeschwindigkeits-SATA3 6Gb/s Schnittstelle
      image: assets/images/product/verico-phantom-3d-nand-ssd/feature-1.png
      image_alt: Ultraschnelle Leistung
    - title: Fortschrittlicher Datenschutz
      description: Fortschrittliche Schutzfunktionen gewährleisten Datenintegrität
        und Gerätesicherheit.
      benefits:
      - '100% Solid-State-Design: stoß- und vibrationsfest, keine beweglichen Teile'
      - 'Fortschrittlicher Datenschutz: TRIM-Befehl, ECC, RAID-Fähigkeit und S.M.A.R.T.-Überwachung'
      image: assets/images/product/verico-phantom-3d-nand-ssd/feature-2.png
      image_alt: Fortschrittlicher Datenschutz
    - title: Breite Kompatibilität
      description: Schlankes Design passt in die meisten Geräte für einfache Installation
        und sofortigen Leistungsschub.
      benefits:
      - Schlanker 7mm ultradünner Formfaktor
      - Kompatibel mit den meisten Desktops, Laptops (einschließlich Ultrabooks)
      - PlayStation 4/4 Pro kompatibel (ab 240GB)
      - Einfacher Installationsprozess
      image: assets/images/product/verico-phantom-3d-nand-ssd/feature-3.png
      image_alt: Breite Kompatibilität
