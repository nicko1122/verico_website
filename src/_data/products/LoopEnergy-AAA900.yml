en:
  name: LoopEnergy AAA900
  category: loopenergy
  description: The LoopEnergy AAA900 is a 1.5V AAA rechargeable Li-ion battery with
    USB Type-C charging, 600mAh (900mWh) capacity, and over 1000 recharge cycles.
    Eco-friendly, safe, and ideal for remote controls, wireless devices, and more.
  catalog_image: assets/images/product/loopenergy-aaa900/900-aaa-4-pack.png
  hero_background: assets/images/global/loopenergy-hero.jpg
  images:
  - assets/images/product/loopenergy-aaa900/900-aaa-4-pack.png
  - assets/images/product/loopenergy-aaa900/900-aaa-cam1.2910246.png
  - assets/images/product/loopenergy-aaa900/900-aaa-cam2.2910247.png
  - assets/images/product/loopenergy-aaa900/a-4c.png
  features:
  - 1.5V constant output for stable device performance
  - 'Fast charging: ~1.5 hours to full'
  - Over 1000 recharge cycles
  - Low self-discharge for long shelf life
  - Built-in overheat, overcharge, overvoltage, and short circuit protection
  specs:
  - name: Battery Type
    value: Li-ion
  - name: Voltage
    value: 1.5V
  - name: Capacity
    value: 600mAh
  - name: Energy
    value: 900mWh
  - name: Charging Port
    value: USB Type-C
  - name: Charging Time
    value: ~1.5 hours
  - name: Recharge Cycles
    value: '>1000'
  - name: Self-Discharge
    value: Low
  detailed_features:
    title: Detailed Features
    subtitle: ''
    items:
    - title: Constant Voltage Output
      description: Delivers a steady 1.5V output for optimal device compatibility.
      benefits:
      - Reliable performance in all devices
      - Prevents voltage drop during use
      image: assets/images/product/loopenergy-aaa900/feature-constant.png
      image_alt: Constant Voltage Output
    - title: Fast & Convenient Charging
      description: Recharge directly via USB Type-C—no special charger required.
      benefits:
      - Universal charging convenience
      - Charge multiple batteries at once
      image: assets/images/product/loopenergy-aaa900/feature-charging.png
      image_alt: Fast & Convenient Charging
    - title: Advanced Safety Protections
      description: Multiple built-in protections for safe daily use.
      benefits:
      - Overheat, overcharge, overvoltage, and short circuit protection
      - Peace of mind for you and your devices
      image: assets/images/product/loopenergy-aaa900/feature-safety.png
      image_alt: Advanced Safety Protections
    - title: Eco-Friendly & Sustainable
      description: One LoopEnergy battery can be recharged up to 1200 times, reducing
        waste and supporting environmental responsibility.
      benefits:
      - Significantly reduces single-use battery waste
      - Promotes a greener, more sustainable lifestyle
      image: assets/images/product/loopenergy-aaa900/feature-eco.png
      image_alt: Eco-Friendly & Sustainable
