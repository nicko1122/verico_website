de:
  name: LoopEnergy AAA900
  category: loopenergy
  description: Die LoopEnergy AAA900 ist eine 1,5V AAA wiederaufladbare Li-Ionen-Batterie
    mit USB Type-C-Ladung, 600mAh (900mWh) Kapazität und über 1000 Ladezyklen. Umweltfreundlich,
    sicher und ideal für Fernbedienungen, kabellose Geräte und mehr.
  catalog_image: assets/images/product/loopenergy-aaa900/900-aaa-4-pack.png
  hero_background: assets/images/global/loopenergy-hero.jpg
  images:
  - assets/images/product/loopenergy-aaa900/900-aaa-4-pack.png
  - assets/images/product/loopenergy-aaa900/900-aaa-cam1.2910246.png
  - assets/images/product/loopenergy-aaa900/900-aaa-cam2.2910247.png
  - assets/images/product/loopenergy-aaa900/a-4c.png
  features:
  - 1,5V konstanter Ausgang für stabile Geräteleistung
  - 'Schnellladung: ~1,5 Stunden bis voll'
  - Über 1000 Ladezyklen
  - Niedrige Selbstentladung für lange Lagerfähigkeit
  - Eingebauter Schutz vor Überhitzung, Überladung, Überspannung und Kurzschluss
  specs:
  - name: Batterietyp
    value: Li-ion
  - name: Spannung
    value: 1.5V
  - name: Kapazität
    value: 600mAh
  - name: Energie
    value: 900mWh
  - name: Ladeanschluss
    value: USB Type-C
  - name: Ladezeit
    value: ~1,5 Stunden
  - name: Ladezyklen
    value: '>1000'
  - name: Selbstentladung
    value: Niedrig
  detailed_features:
    title: Detaillierte Merkmale
    subtitle: ''
    items:
    - title: Konstanter Spannungsausgang
      description: Bietet einen stabilen 1,5V-Ausgang für optimale Gerätekompatibilität.
      benefits:
      - Zuverlässige Leistung in allen Geräten
      - Verhindert Spannungsabfall während der Nutzung
      image: assets/images/product/loopenergy-aaa900/feature-constant.png
      image_alt: Konstanter Spannungsausgang
    - title: Schnelles & bequemes Laden
      description: Direktes Aufladen über USB Type-C – kein spezielles Ladegerät erforderlich.
      benefits:
      - Universelle Ladebequemlichkeit
      - Mehrere Batterien gleichzeitig laden
      image: assets/images/product/loopenergy-aaa900/feature-charging.png
      image_alt: Schnelles & bequemes Laden
    - title: Fortschrittliche Sicherheitsfunktionen
      description: Mehrere integrierte Schutzmechanismen für sicheren täglichen Gebrauch.
      benefits:
      - Schutz vor Überhitzung, Überladung, Überspannung und Kurzschluss
      - Sicherheit für Sie und Ihre Geräte
      image: assets/images/product/loopenergy-aaa900/feature-safety.png
      image_alt: Fortschrittliche Sicherheitsfunktionen
    - title: Umweltfreundlich & nachhaltig
      description: Eine LoopEnergy-Batterie kann bis zu 1200 Mal wieder aufgeladen
        werden, reduziert Abfall und unterstützt Umweltverantwortung.
      benefits:
      - Reduziert deutlich den Abfall von Einwegbatterien
      - Fördert einen grüneren, nachhaltigeren Lebensstil
      image: assets/images/product/loopenergy-aaa900/feature-eco.png
      image_alt: Umweltfreundlich & nachhaltig
  compatibility:
