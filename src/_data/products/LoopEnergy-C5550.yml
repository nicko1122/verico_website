en:
  name: LoopEnergy C5550
  category: loopenergy
  description: The LoopEnergy C5550 is a 1.5V high-capacity Li-ion rechargeable battery
    (3700mAh / 5550mWh) with USB Type-C charging. Ideal for high-drain devices, eco-friendly,
    and supports hundreds of recharge cycles.
