  - assets/images/product/verico-powerplus-air-v2-10000mah-wireless-power-bank/powerplusairv2-2.png
  - assets/images/product/verico-powerplus-air-v2-10000mah-wireless-power-bank/powerplusairv2-3.png
  - assets/images/product/verico-powerplus-air-v2-10000mah-wireless-power-bank/powerplusairv2-4.png
  features:
  - '15W Wireless Charging: Qi standard support for cable-free, instant charging—just
    place your phone and go.'
  - 'Multi-Port Fast Charging: Dual USB-A and one Type-C output, supporting up to
    12V/1.67A for rapid charging of multiple devices.'
  - 'Dual Input Design: Recharge via Micro-USB or Type-C for flexible convenience.'
  - 'Ultra-Slim & Lightweight: Only 15mm thick and 220g, perfect for travel or daily
    commutes.'
  - 'Smart Current Distribution: Automatically detects device needs for stable and
    safe power delivery.'
