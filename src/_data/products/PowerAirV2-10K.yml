  detailed_features:
    title: Detailed Features
    subtitle: ''
    items:
    - title: 15W Wireless Fast Charging
      description: Enjoy true wireless freedom with Qi-certified 15W fast charging.
        Simply place your compatible device on the power bank for instant, cable-free
        charging.
      benefits:
      - No more tangled cables
      - Fast and convenient charging for Qi-enabled devices
      image: null
      image_alt: null
    - title: Multi-Device Fast Charging
      description: Charge up to three devices at once with dual USB-A and one Type-C
        output, supporting multiple fast charging protocols.
      benefits:
      - Power up your phone, tablet, and accessories simultaneously
      - Fast charging for a variety of devices
      image: null
      image_alt: null
    - title: Dual Input Flexibility
      description: Recharge the power bank via either Micro-USB or Type-C input, offering
        flexibility and convenience.
      benefits:
      - Use your preferred charging cable
      - Never worry about compatibility
      image: null
      image_alt: null
    - title: Ultra-Slim & Portable
      description: At just 15mm thick and 220g, the PowerPlus Air V2 is designed for
        easy carrying—perfect for travel, work, or daily use.
      benefits:
      - Fits easily in your bag or pocket
      - Lightweight for effortless portability
      image: null
      image_alt: null
    - title: Smart & Safe Charging
      description: Intelligent current distribution automatically detects and delivers
        the optimal power for each connected device, ensuring safe and efficient charging.
      benefits:
      - Protects your devices from overcurrent and overheating
      - Stable and reliable power output
      image: null
      image_alt: null
