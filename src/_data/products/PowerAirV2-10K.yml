  - name: Max Output by Port
    value: 'USB 1 & 2: 5V/3A, 9V/2A, 12V/1.5A; Type-C: 5V/3A, 9V/2.2A, 12V/1.67A'
  - name: Output Ports
    value: USB Type-A x2, Type-C x1
  - name: Input Ports
    value: Type-C, Micro-USB
  - name: Dimensions
    value: 145 × 68 × 15 mm
  - name: Weight
    value: 220g
