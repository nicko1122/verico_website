en:
  name: Verico PowerPlus Air V2 10000mAh Wireless Power Bank
  category: powerbank
  description: Verico PowerPlus Air V2 10,000mAh — Wireless Fast Charging, Ultra-Slim
    & Portable. The PowerPlus Air V2 combines high performance with minimalist design,
    featuring a 10,000mAh lithium polymer battery, 15W wireless charging, and multiple
    fast charging protocols for ultimate convenience and freedom.
  catalog_image: assets/images/product/verico-powerplus-air-v2-10000mah-wireless-power-bank/powerplusairv2-main.png
  hero_background: assets/images/global/powerbank-hero.jpg
  images:
