de:
  name: LoopEnergy Pro PP35400
  category: loopenergy
  description: Der LoopEnergy Pro PP35400 ist eine Li-Ionen-Akku der nächsten Generation
    mit 9V hoher Kapazität (600mAh / 5400mWh) und fortschrittlichem USB Type-C-Laden.
    Entwickelt für Profis und anspruchsvolle Nutzer bietet er außergewöhnliche Leistung,
    ultra-stabile Ausgangsspannung und überlegene Sicherheit für Geräte mit hohem
    Stromverbrauch. Erleben Sie Profi-Leistung, Zuverlässigkeit und Nachhaltigkeit
    bei jeder Ladung.
  catalog_image: assets/images/product/loopenergy-pro-pp35400/pp3-5400-pro-main.png
  hero_background: assets/images/global/loopenergy-hero.jpg
  images:
  - assets/images/product/loopenergy-pro-pp35400/pp3-5400-pro-main.png
  - assets/images/product/loopenergy-pro-pp35400/pp3-5400-pro-1.png
  - assets/images/product/loopenergy-pro-pp35400/pp3-5400-pro-2.png
  - assets/images/product/loopenergy-pro-pp35400/pp3-5400-pro-cable.png
  features:
  - 9V konstanter Ausgang für maximale Geräteleistung
  - 'Hohe Kapazität: 600mAh (5400mWh) für verlängerte Laufzeit'
  - Schnelles und effizientes USB Type-C-Laden
  - Über 1000 Ladezyklen für langfristigen Wert
  - Ultra niedrige Selbstentladung für zuverlässige Lagerung
  - 'Umfassende Sicherheit: Überhitzungs-, Überlade-, Überspannungs- und Kurzschlussschutz'
  specs:
  - name: Batterietyp
    value: Li-ion
  - name: Spannung
    value: 9V / 5400mWh
  - name: Kapazität
    value: 600mAh
  detailed_features:
    title: Detaillierte Merkmale
    subtitle: ''
    items:
    - title: Konstanter Spannungsausgang
      description: Bietet eine äußerst stabile 9V-Ausgangsspannung für optimale Kompatibilität
        und gleichbleibende Leistung, selbst bei anspruchsvollsten Geräten.
      benefits:
      - Zuverlässigkeit auf Profi-Niveau
      - Verhindert Spannungsabfall bei starker Nutzung
      image: assets/images/product/loopenergy-pro-pp35400/feature-constant.png
      image_alt: Konstanter Spannungsausgang
    - title: Schnelles & Bequemes Laden
      description: Direktes Aufladen über USB Type-C – kein proprietäres Ladegerät
        erforderlich. Schneller zurück zur Arbeit mit raschem Laden.
      benefits:
      - Universelle Ladebequemlichkeit
      - Mehrere Batterien gleichzeitig laden
      image: assets/images/product/loopenergy-pro-pp35400/feature-charging.png
      image_alt: Schnelles & Bequemes Laden
    - title: Fortschrittliche Sicherheitsfunktionen
      description: Ausgestattet mit mehreren Schutzschichten für sicheren, sorgenfreien
        Betrieb in jeder Umgebung.
      benefits:
      - Schutz vor Überhitzung, Überladung, Überspannung und Kurzschluss
      - Sicherheit für professionelle und alltägliche Nutzung
      image: assets/images/product/loopenergy-pro-pp35400/feature-safety.png
      image_alt: Fortschrittliche Sicherheitsfunktionen
    - title: Umweltfreundlich & Nachhaltig
      description: Jede LoopEnergy Pro PP35400 Batterie kann über 1000 Mal wieder
        aufgeladen werden, was Abfall drastisch reduziert und eine grünere Zukunft
        unterstützt.
      benefits:
      - Reduziert Einwegbatterie-Abfall
      - Fördert nachhaltigen, verantwortungsvollen Energieeinsatz
      image: assets/images/product/loopenergy-pro-pp35400/feature-eco.png
      image_alt: Umweltfreundlich & Nachhaltig
