en:
  name: LoopEnergy Pro PP35400
  category: loopenergy
  description: The LoopEnergy Pro PP35400 is a next-generation 9V high-capacity Li-ion
    rechargeable battery (600mAh / 5400mWh) with advanced USB Type-C charging. Engineered
    for professionals and demanding users, it delivers exceptional power, ultra-stable
    output, and superior safety for high-drain devices. Experience pro-level performance,
    reliability, and sustainability in every charge.
