  detailed_features:
    title: Detaillierte Funktionen
    subtitle: ''
    items:
    - title: Konstante Spannungsausgabe
      description: Bietet eine äußerst stabile 1,5 V Ausgangsspannung für optimale
        Kompatibilität und gleichbleibende Leistung, selbst bei anspruchsvollsten
        Geräten.
      benefits:
      - Zuverlässigkeit auf Profi-Niveau
      - Verhindert Spannungsabfall bei hoher Belastung
      image: assets/images/product/loopenergy-pro-c6750/feature-constant.png
      image_alt: Konstante Spannungsausgabe
    - title: Schnelles & bequemes Laden
      description: Direktes Aufladen über USB Type-C – kein proprietäres Ladegerät
        erforderlich. Schneller zurück zur Arbeit dank Schnellladung.
      benefits:
      - Universelle Ladebequemlichkeit
      - Gleichzeitiges Laden mehrerer Akkus
      image: assets/images/product/loopenergy-pro-c6750/feature-charging.png
      image_alt: Schnelles & bequemes Laden
    - title: Fortschrittliche Sicherheitsfunktionen
      description: Ausgestattet mit mehreren Schutzschichten für sicheren und sorgenfreien
        Betrieb in jeder Umgebung.
      benefits:
      - Schutz vor Überhitzung, Überladung, Überspannung und Kurzschluss
      - Sicherheit für professionelle und den täglichen Gebrauch
      image: assets/images/product/loopenergy-pro-c6750/feature-safety.png
      image_alt: Fortschrittliche Sicherheitsfunktionen
    - title: Umweltfreundlich & nachhaltig
      description: Jeder LoopEnergy Pro C6750 Akku kann über 1000 Mal wieder aufgeladen
        werden, was Abfall drastisch reduziert und eine grünere Zukunft unterstützt.
      benefits:
      - Reduziert Einweg-Batterieabfall
      - Fördert nachhaltigen und verantwortungsvollen Energieeinsatz
      image: assets/images/product/loopenergy-pro-c6750/feature-eco.png
      image_alt: Umweltfreundlich & nachhaltig
