de:
  name: LoopEnergy Pro C6750
  category: loopenergy
  description: Der LoopEnergy Pro C6750 ist eine Li-Ionen-Akku der nächsten Generation
    mit 1,5 V und hoher Kapazität (4500mAh / 6750mWh) mit fortschrittlicher USB Type-C-Ladetechnologie.
    Entwickelt für Profis und anspruchsvolle Nutzer bietet er außergewöhnliche Leistung,
    ultra-stabile Ausgangsspannung und überlegene Sicherheit für Geräte mit hohem
    Stromverbrauch. Erleben Sie Profi-Leistung, Zuverlässigkeit und Nachhaltigkeit
    bei jeder Ladung.
  catalog_image: assets/images/product/loopenergy-pro-c6750/c6750-pro-main.png
  hero_background: assets/images/global/loopenergy-hero.jpg
  images:
  - assets/images/product/loopenergy-pro-c6750/c6750-pro-main.png
  - assets/images/product/loopenergy-pro-c6750/c6750-pro-1.png
  - assets/images/product/loopenergy-pro-c6750/c6750-pro-2.png
  - assets/images/product/loopenergy-pro-c6750/c6750-pro-cable.png
  features:
  - 1,5 V konstante Ausgangsspannung für maximale Geräteleistung
  - 'Ultra-hohe Kapazität: 4500mAh (6750mWh) für verlängerte Laufzeit'
  - Schnelles und effizientes USB Type-C-Laden
  - Über 1000 Ladezyklen für langfristigen Wert
  - Ultra-niedrige Selbstentladung für zuverlässige Lagerung
  - 'Umfassende Sicherheit: Schutz vor Überhitzung, Überladung, Überspannung und Kurzschluss'
  specs:
