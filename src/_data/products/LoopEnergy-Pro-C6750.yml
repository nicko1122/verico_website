  category: loopenergy
  description: The LoopEnergy Pro C6750 is a next-generation 1.5V high-capacity Li-ion
    rechargeable battery (4500mAh / 6750mWh) with advanced USB Type-C charging. Engineered
    for professionals and demanding users, it delivers exceptional power, ultra-stable
    output, and superior safety for high-drain devices. Experience pro-level performance,
    reliability, and sustainability in every charge.
