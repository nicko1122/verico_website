en:
  name: VERICO MOJO 65W 3 Ports PD 3.0 GaN Charger
  category: gan_charger
  description: The VERICO MOJO 65W 3 Ports PD 3.0 GaN Charger delivers ultra-fast,
    reliable charging for all your devices in a compact, travel-ready design. Featuring
    advanced GaN technology, triple-port versatility, and comprehensive safety protections,
    it’s the perfect companion for smartphones, tablets, laptops, and more.
  catalog_image: assets/images/product/verico-mojo-65w-3-ports-pd-30-gan-charger/mojo-65w-main.png
  hero_background: assets/images/global/gancharger-hero.jpg
  images:
  - assets/images/product/verico-mojo-65w-3-ports-pd-30-gan-charger/mojo-65w-main.png
  - assets/images/product/verico-mojo-65w-3-ports-pd-30-gan-charger/mojo-65w-1.png
  - assets/images/product/verico-mojo-65w-3-ports-pd-30-gan-charger/mojo-65w-2.png
  - assets/images/product/verico-mojo-65w-3-ports-pd-30-gan-charger/mojo-65w-3.png
  - assets/images/product/verico-mojo-65w-3-ports-pd-30-gan-charger/mojo-65w-4.png
  features:
  - Advanced GaN technology for higher efficiency and compact size
  - 'Triple-port design: 2 × USB-C + 1 × USB-A for simultaneous charging'
  - 65W max output for fast charging of phones, tablets, laptops, and more
  - 'Built-in protection: overheat, overvoltage, and short circuit safeguards'
  - Compact, travel-ready, and robust build
  - 2-year warranty for peace of mind
  specs:
  - name: Input
    value: 100–240V ~ 50/60Hz 1.5A
  - name: USB-C1/C2 Output
    value: 5V⎓3A, 9V⎓3A, 12V⎓3A, 15V⎓3A, 20V⎓3.25A
  - name: USB-A Output
    value: 5V⎓3A, 9V⎓3A, 12V⎓3A, 20V⎓3A
  - name: USB-C1 + USB-C2 Max Output
    value: 45W + 18W (63W)
  - name: USB-C1 + USB-A Max Output
    value: 45W + 18W (63W)
  - name: USB-C2 + USB-A Max Output
    value: 5V = 4.8A (24W)
  - name: USB-C1 + (USB-C2 + USB-A) Max Output
    value: 45W + 15W (60W)
  - name: Ports
    value: 2 × USB-C, 1 × USB-A
  - name: Dimensions
    value: 35 × 40 × 75 mm (without plug)
  - name: Weight
    value: 130.7g
  detailed_features:
    title: Detailed Features
    subtitle: ''
    items:
    - title: Advanced GaN Technology
      description: Delivers higher efficiency and a smaller footprint, ensuring powerful
        charging in a compact form.
      benefits:
      - Smaller size, more power
      - Improved thermal performance
      - Longer component lifespan
      image: assets/images/product/verico-mojo-65w-3-ports-pd-30-gan-charger/feature-1.png
      image_alt: Advanced GaN Technology
    - title: Comprehensive Protection
      description: Built-in safeguards against overheat, overvoltage, and short circuit
        for worry-free charging.
      benefits:
      - Safe for daily use
      - Protects your devices
      image: assets/images/product/verico-mojo-65w-3-ports-pd-30-gan-charger/feature-2.png
      image_alt: Comprehensive Protection
    - title: Triple-Port Versatility
      description: Charge up to three devices at once with 2 × USB-C and 1 × USB-A
        port.
      benefits:
      - No more waiting or juggling chargers
      - Ideal for travel, work, and multitasking
      image: assets/images/product/verico-mojo-65w-3-ports-pd-30-gan-charger/feature-3.png
      image_alt: Triple-Port Versatility
    - title: Compact & Travel-Ready
      description: Slim, robust design makes it the perfect travel companion.
      benefits:
      - Easy to pack and carry
      - Always ready on the go
      image: assets/images/product/verico-mojo-65w-3-ports-pd-30-gan-charger/feature-4.png
      image_alt: Compact & Travel-Ready
