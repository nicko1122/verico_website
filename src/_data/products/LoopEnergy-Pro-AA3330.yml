de:
  name: LoopEnergy Pro AA3330
  category: loopenergy
  description: Der LoopEnergy Pro AA3330 ist eine Li-Ionen-Akku der nächsten Generation
    mit 1,5 V AA, der eine leistungsstarke Kapazität von 2220mAh (3330mWh) und fortschrittliches
    USB Type-C-Laden bietet. Entwickelt für Profis und anspruchsvolle Nutzer, bietet
    er außergewöhnliche Leistung, überlegene Sicherheit und eine ultra-lange Lebensdauer
    für Geräte mit hohem Stromverbrauch.
  catalog_image: assets/images/product/loopenergy-pro-aa3330/AA-3330-pro-main.png
  hero_background: assets/images/global/loopenergy-hero.jpg
  images:
  - assets/images/product/loopenergy-pro-aa3330/AA-3330-pro-main.png
  - assets/images/product/loopenergy-pro-aa3330/AA-3330-pro-1.png
