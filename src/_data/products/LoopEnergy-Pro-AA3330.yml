  - assets/images/product/loopenergy-pro-aa3330/AA-3330-pro-cable.png
  features:
  - 1,5 V konstanter Ausgang für maximale Geräteleistung
  - 'Hohe Kapazität: 2220mAh (3330mWh) für verlängerte Laufzeit'
  - Schnelles und effizientes USB Type-C-Laden
  - Über 1000 Ladezyklen für langfristigen Wert
  - Ultra-niedrige Selbstentladung für zuverlässige Lagerung
  - 'Umfassende Sicherheit: Schutz vor Überhitzung, Überladung, Überspannung und Kurzschluss'
  specs:
