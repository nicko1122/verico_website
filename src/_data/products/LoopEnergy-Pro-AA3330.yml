  detailed_features:
    title: Detaillierte Funktionen
    subtitle: ''
    items:
    - title: Konstanter Spannungsausgang
      description: Bietet einen stabilen 1,5 V Ausgang für optimale Kompatibilität
        und gleichbleibende Leistung, selbst in den anspruchsvollsten Geräten.
      benefits:
      - Zuverlässigkeit auf professionellem Niveau
      - Verhindert Spannungsabfall bei hoher Belastung
      image: assets/images/product/loopenergy-pro-aa3330/feature-constant.png
      image_alt: Konstanter Spannungsausgang
    - title: Schnelles & bequemes Laden
      description: Direktes Aufladen über USB Type-C – kein proprietäres Ladegerät
        erforderlich. Schneller zurück zur Arbeit mit Schnellladung.
      benefits:
      - Universelle Ladebequemlichkeit
      - Mehrere Batterien gleichzeitig laden
      image: assets/images/product/loopenergy-pro-aa3330/feature-charging.png
      image_alt: Schnelles & bequemes Laden
    - title: Fortschrittliche Sicherheitsfunktionen
      description: Ausgestattet mit mehreren Schutzschichten für sicheren, sorgenfreien
        Betrieb in jeder Umgebung.
      benefits:
      - Schutz vor Überhitzung, Überladung, Überspannung und Kurzschluss
      - Sicherheit für professionelle und den täglichen Gebrauch
      image: assets/images/product/loopenergy-pro-aa3330/feature-safety.png
      image_alt: Fortschrittliche Sicherheitsfunktionen
    - title: Umweltfreundlich & nachhaltig
      description: Jeder LoopEnergy Pro AA3330 Akku kann über 1000 Mal wieder aufgeladen
        werden, was Abfall drastisch reduziert und eine grünere Zukunft unterstützt.
      benefits:
      - Reduziert Abfall durch Einwegbatterien
      - Fördert nachhaltigen, verantwortungsvollen Energieverbrauch
      image: assets/images/product/loopenergy-pro-aa3330/feature-eco.png
      image_alt: Umweltfreundlich & nachhaltig
