  - name: Max Input by Port
    value: 'Micro-USB: 5V/2A, 9V/2A, 12V/1.5A; Type-C: 5V/3A, 9V/2A, 12V/1.5A'
  - name: Max Output by Port
    value: 'USB-A: 4.5V/5A, 5V/4.5A, 9V/2A, 12V/1.5A; Type-C: 5V/3A, 9V/2.2A, 12V/1.6A'
  - name: Output Ports
    value: USB Type-A x2, Type-C x1
  - name: Input Ports
    value: Type-C, Micro-USB
  - name: Dimensions
    value: 68 x 26 x 145 mm
  - name: Weight
    value: 476g
