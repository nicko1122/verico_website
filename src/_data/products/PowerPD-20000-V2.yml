  - assets/images/product/verico-power-pro-pd-v2-20000mah-power-bank/powerpro-pd-v2-2.png
  - assets/images/product/verico-power-pro-pd-v2-20000mah-power-bank/powerpro-pd-v2-3.png
  - assets/images/product/verico-power-pro-pd-v2-20000mah-power-bank/powerpro-pd-v2-4.png
  features:
  - 'PD Fast Charging: Type-C output up to 12V/1.6A, supports fast charging for laptops
    and other PD-enabled devices.'
  - 'High-Power USB-A Output: Supports up to 4.5V/5A, compatible with multiple fast
    charging protocols for enhanced efficiency.'
  - 'Dual Input Design: Recharge via Micro-USB or Type-C for flexible convenience.'
  - 'Triple Output: Charge up to three devices simultaneously (USB-A x2 + Type-C x1).'
  - 'Smart Current Distribution: Automatically detects device needs for stable and
    safe power delivery.'
  - 'Sleek Black Design: Minimalist and professional look, suitable for business and
    everyday use.'
