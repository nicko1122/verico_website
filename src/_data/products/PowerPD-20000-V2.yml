    items:
    - title: PD Fast Charging for Laptops & More
      description: Charge your PD-enabled laptop, tablet, or smartphone at top speed
        with up to 12V/1.6A output via Type-C Power Delivery.
      benefits:
      - Rapid charging for laptops, tablets, and phones
      - Less downtime, more productivity
      image: null
      image_alt: null
    - title: Triple Device Charging
      description: Simultaneously charge up to three devices with dual USB-A and one
        Type-C output.
      benefits:
      - Power up your phone, tablet, and accessories at once
      - Share power with friends or colleagues
      image: null
      image_alt: null
    - title: Dual Input Flexibility
      description: Recharge the power bank via either Micro-USB or Type-C input for
        maximum convenience.
      benefits:
      - Use your preferred charging cable
      - Never worry about compatibility
      image: null
      image_alt: null
    - title: Smart & Safe Charging
      description: Intelligent current distribution automatically detects and delivers
        the optimal power for each connected device, ensuring safe and efficient charging.
      benefits:
      - Protects your devices from overcurrent and overheating
      - Stable and reliable power output
      image: null
      image_alt: null
    - title: Sleek & Professional Design
