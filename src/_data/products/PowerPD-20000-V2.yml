en:
  name: Verico Power Pro PD V2 20000mAh Power Bank
  category: powerbank
  description: Verico Power Pro PD V2 20,000mAh — High-Speed Charging, Even for Laptops.
    The Power Pro PD V2 20000 is a high-performance power bank designed for mobile
    professionals and multi-device users, featuring a massive 20,000mAh/74Wh polymer
    cell, USB Type-C PD fast charging, and the ability to power up laptops, tablets,
    and smartphones with ease.
  catalog_image: assets/images/product/verico-power-pro-pd-v2-20000mah-power-bank/powerpro-pd-v2-main.png
  hero_background: assets/images/global/powerbank-hero.jpg
  images:
