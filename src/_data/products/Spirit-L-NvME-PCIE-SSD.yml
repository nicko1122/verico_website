    items:
    - title: Blazing Performance; Friendly Price!
      description: With superb cost to performance ratio, VERICO SPIRIT-L is the best
        upgrade choice for super fast M.2 SSD performance with friendly prices.
      benefits:
      - Up to 3200MB/s read speed
      - Up to 12300B/s write speed
      - Excellent value for money
      - Perfect for budget-conscious users
      image: assets/images/product/verico-spirit-l-nvme-m2-solid-state-drive/feature-1.png
      image_alt: Blazing Performance; Friendly Price!
    - title: Be Ready for the Speed!
      description: Be ready to be impressed by the amazing read/write speed performance
        that VERICO SPIRIT-L M.2 SSD provides! You will never go back to traditional
        hard drives again!
      benefits:
      - Up to 180,000 IOPS for read operations
      - Up to 180,000 IOPS for write operations
      - Impressive data processing speed
      - Superior to traditional hard drives
      image: assets/images/product/verico-spirit-l-nvme-m2-solid-state-drive/feature-2.png
      image_alt: Be Ready for the Speed!
    - title: Discreet, Yet Powerful
      description: 'The VERICO SPIRIT-L is in compliance with PCIe Gen. 3 x2 and NVMe
        1.3: discreetly hidden on your motherboard, yet offers blazing performance.'
      benefits:
      - PCIe 3.0 x4 with NVMe 1.3 interface
      - Discreet motherboard installation
      - Blazing performance in compact form
      - Modern NVMe technology
      image: assets/images/product/verico-spirit-l-nvme-m2-solid-state-drive/feature-3.png
      image_alt: Discreet, Yet Powerful
